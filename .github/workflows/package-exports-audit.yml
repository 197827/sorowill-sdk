name: Package Exports Audit

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  audit-exports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build package
        run: npm run build

      - name: Run export audit tests
        run: npm test -- package-exports-audit.test.ts

      - name: Check ESM and CJS type resolution
        run: |
          # Run arethetypeswrong via npx (pinned) without mutating package.json or the lockfile.
          # Known/ignored problems are listed explicitly in the allowlist below; any other
          # type-resolution problem fails the workflow.
          set -o pipefail

          ALLOWLIST="FalseESM|FalseCJS|CJSResolvesToESM"

          npx --yes @arethetypeswrong/cli@0.17.4 --check-all dist/index.js dist/index.cjs --format json > attw.json

          node -e "
          const fs = require('fs');
          const allowlist = new Set(process.env.ALLOWLIST.split('|'));
          const report = JSON.parse(fs.readFileSync('attw.json', 'utf8'));

          const problems = (report.problems || []).filter((p) => !allowlist.has(p.name));

          if (problems.length > 0) {
            console.error('arethetypeswrong found type-resolution problems:');
            for (const p of problems) {
              console.error(' - ' + p.name + (p.resolutionKind ? ' (' + p.resolutionKind + ')' : ''));
            }
            process.exit(1);
          }

          console.log('✓ No unexpected type-resolution problems');
          "
        env:
          ALLOWLIST: FalseESM|FalseCJS|CJSResolvesToESM

      - name: Validate package.json exports
        run: |
          node -e "
          const pkg = require('./package.json');
          const main = pkg.exports['.'];
          const react = pkg.exports['./react'];

          if (!main || !main.types || !main.import || !main.require) {
            throw new Error('Main export missing required fields: types, import, require');
          }

          if (!react || !react.types || !react.import || !react.require) {
            throw new Error('React export missing required fields: types, import, require');
          }

          console.log('✓ All export fields are properly configured');
          "
